<title>Imelda Bible Baptist Church Hymns</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F4EFE3;
    --paper-raised: #FBF8F1;
    --ink: #262019;
    --ink-soft: #5B5346;
    --ink-faint: #948C7C;
    --rule: #DCD3BF;
    --amber: #C77F1E;
    --amber-deep: #93590E;
    --amber-wash: #F1DFB9;
    --danger: #A3402E;
    --shadow: rgba(38, 32, 25, 0.14);

    --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
    --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;

    --lyric-size: 16px;
    color-scheme: light;

    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  :root[data-theme="dark"] {
    --paper: #1B1712;
    --paper-raised: #221C15;
    --ink: #EFE8D8;
    --ink-soft: #BDB09A;
    --ink-faint: #7B715F;
    --rule: #3A3226;
    --amber: #E3A64C;
    --amber-deep: #F0BE74;
    --amber-wash: #3A2C15;
    --danger: #D97B64;
    --shadow: rgba(0, 0, 0, 0.4);
    color-scheme: dark;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1B1712;
      --paper-raised: #221C15;
      --ink: #EFE8D8;
      --ink-soft: #BDB09A;
      --ink-faint: #7B715F;
      --rule: #3A3226;
      --amber: #E3A64C;
      --amber-deep: #F0BE74;
      --amber-wash: #3A2C15;
      --danger: #D97B64;
      --shadow: rgba(0, 0, 0, 0.4);
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-ui);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  button {
    font-family: var(--font-ui);
    cursor: pointer;
  }

  input, textarea, select {
    font-family: var(--font-ui);
  }

  /* ---------- App shell ---------- */

  .app {
    height: 100%;
    display: grid;
    grid-template-columns: 280px 1fr;
    grid-template-rows: 100%;
  }

  .app.drawer-open .scrim {
    display: block;
  }

  /* ---------- Sidebar ---------- */

  .sidebar {
    background: var(--paper-raised);
    border-right: 1px solid var(--rule);
    display: flex;
    flex-direction: column;
    min-width: 0;
    height: 100%;
  }

  .sidebar-head {
    padding: 20px 18px 14px;
    padding-top: calc(20px + env(safe-area-inset-top, 0px));
    border-bottom: 1px solid var(--rule);
    flex-shrink: 0;
  }

  .wordmark {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 0 0 14px;
  }

  .wordmark .glyph { line-height: 0; flex-shrink: 0; }
  .wordmark .glyph svg { display: block; width: 44px; height: 44px; }

  .wordmark .name {
    flex: 1;
    min-width: 0;
    font-family: var(--font-display);
    font-size: 17px;
    font-weight: 500;
    line-height: 1.25;
    letter-spacing: 0.01em;
  }

  .close-drawer {
    display: none;
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 22px;
    padding: 2px 6px;
    margin-left: auto;
  }

  .search-row {
    position: relative;
  }

  .search-row input {
    width: 100%;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 9px 12px;
    font-size: 14px;
    color: var(--ink);
  }

  .search-row input:focus-visible {
    outline: 2px solid var(--amber);
    outline-offset: 1px;
  }

  .search-row input::placeholder { color: var(--ink-faint); }

  .new-song-btn {
    width: 100%;
    margin-top: 10px;
    background: transparent;
    border: 1px solid var(--amber-deep);
    color: var(--amber-deep);
    border-radius: 3px;
    padding: 8px 12px;
    font-size: 13.5px;
    font-weight: 500;
    letter-spacing: 0.01em;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .new-song-btn:hover { background: var(--amber-deep); color: var(--paper-raised); }
  .new-song-btn:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  .song-list {
    flex: 1;
    overflow-y: auto;
    padding: 6px 0 16px;
  }

  .song-card {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-left: 3px solid transparent;
    padding: 11px 16px 11px 15px;
    cursor: pointer;
    color: var(--ink);
  }
  .song-card:hover { background: var(--amber-wash); }
  .song-card:focus-visible { outline: 2px solid var(--amber); outline-offset: -2px; }
  .song-card.active {
    background: var(--amber-wash);
    border-left-color: var(--amber-deep);
  }
  .song-card .t {
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 500;
    line-height: 1.25;
  }
  .song-card .a {
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-top: 2px;
  }

  .empty-list {
    padding: 24px 18px;
    color: var(--ink-faint);
    font-size: 13.5px;
    line-height: 1.5;
  }

  .theme-row {
    border-top: 1px solid var(--rule);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .theme-row span { font-size: 12.5px; color: var(--ink-faint); }

  .sync-status {
    font-size: 12px;
    color: var(--amber-deep);
    background: var(--amber-wash);
    padding: 7px 16px;
    border-top: 1px solid var(--rule);
    text-align: center;
  }
  .theme-toggle {
    background: none;
    border: 1px solid var(--rule);
    border-radius: 20px;
    width: 44px;
    height: 24px;
    position: relative;
    padding: 0;
  }
  .theme-toggle .dot {
    position: absolute;
    top: 2px; left: 2px;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--amber-deep);
    transition: left 0.15s ease;
  }
  :root[data-theme="dark"] .theme-toggle .dot { left: 22px; }

  .install-row {
    display: none;
    border-top: 1px solid var(--rule);
    padding: 10px 16px;
    flex-shrink: 0;
  }
  .install-row.visible { display: block; }
  .install-btn {
    width: 100%;
    background: var(--amber-deep);
    color: var(--paper-raised);
    border: none;
    border-radius: 3px;
    padding: 8px 12px;
    font-size: 13px;
    font-weight: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .install-btn:hover { background: var(--amber); }
  .install-btn:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  /* ---------- Main pane ---------- */

  .main {
    height: 100%;
    overflow-y: auto;
    position: relative;
  }

  .scrim {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 5;
  }

  .topbar {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    padding-top: calc(12px + env(safe-area-inset-top, 0px));
    border-bottom: 1px solid var(--rule);
    background: var(--paper);
    position: sticky;
    top: 0;
    z-index: 3;
  }
  .menu-btn {
    background: none;
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 6px 10px;
    color: var(--ink);
    font-size: 14px;
  }

  .stage {
    max-width: 720px;
    margin: 0 auto;
    padding: 40px 32px 90px;
  }

  .placeholder {
    padding: 80px 32px;
    text-align: center;
    color: var(--ink-faint);
  }
  .placeholder .glyph {
    font-family: var(--font-display);
    font-style: italic;
    font-size: 44px;
    color: var(--rule);
    margin-bottom: 6px;
  }
  .placeholder p { font-size: 14.5px; max-width: 320px; margin: 8px auto 0; line-height: 1.6; }
  .placeholder button {
    margin-top: 18px;
    background: var(--amber-deep);
    color: var(--paper-raised);
    border: none;
    border-radius: 3px;
    padding: 9px 18px;
    font-size: 13.5px;
    font-weight: 500;
  }

  /* ---------- Song header / toolbar ---------- */

  .song-head {
    margin-bottom: 6px;
  }
  .song-title {
    font-family: var(--font-display);
    font-size: 34px;
    font-weight: 600;
    line-height: 1.15;
    margin: 0;
  }
  .song-artist {
    font-size: 15px;
    color: var(--ink-soft);
    margin-top: 4px;
  }

  .tag-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 12px;
  }
  .tag {
    font-size: 12px;
    color: var(--ink-soft);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 3px 8px;
  }
  .tag b { color: var(--ink); font-weight: 600; }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
    margin-top: 22px;
    padding: 12px 14px;
    background: var(--paper-raised);
    border: 1px solid var(--rule);
    border-radius: 4px;
  }
  .tool-group { display: flex; align-items: center; gap: 6px; }
  .tool-label { font-size: 11.5px; color: var(--ink-faint); margin-right: 2px; }
  .step-btn {
    background: var(--paper);
    border: 1px solid var(--rule);
    color: var(--ink);
    width: 28px; height: 28px;
    border-radius: 3px;
    font-size: 14px;
    line-height: 1;

  .step-btn:hover { border-color: var(--amber-deep); color: var(--amber-deep); }

  .chord-row {

    border: 1px solid var(--rule);
    border-radius: 3px;

    border: none;
    color: var(--ink-soft);
    font-size: 12.5px;
    padding: 6px 11px;

  .sl-count { font-size: 14px; color: #BDB09A; min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; }
  .sl-stage {

  .sl-content { max-width: 100%; }
  .sl-label {
    font-family: var(--font-ui); font-size: clamp(14px, 2.4vmin, 26px);
    color: #E3A64C; margin-bottom: 2.4vmin; letter-spacing: 0.03em;
  }
  .sl-body { font-family: var(--font-display); line-height: 1.35; white-space: pre-wrap; overflow-wrap: anywhere; }
  .sl-title { font-family: var(--font-display); font-weight: 600; line-height: 1.12; }

  .sidebar-tabs { margin: 0 0 12px; }

  .list-row { display: flex; align-items: stretch; }

  .editor-help {

  .body-textarea {
    width: 100%;

  .editor-actions {

    margin-top: 18px;
    justify-content: flex-end;
  }
  .btn {
    border-radius: 3px;
    padding: 9px 18px;
    font-size: 13.5px;
    font-weight: 500;
    border: 1px solid var(--rule);
    background: var(--paper-raised);
    color: var(--ink);

  .btn:hover { border-color: var(--ink-faint); }
  .btn.primary {

  .btn.primary:hover { background: var(--amber); border-color: var(--amber); }
  .btn:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  .confirm-row {
    display: inline-flex;
    align-items: center;
    gap: 8px;

  @media (max-width: 760px) {

    .stage { padding: 26px 18px 70px; }

    .editor-fields { grid-template-columns: 1fr; }

  var state = {
    songs: [],
    activeId: null,
    mode: "view", // view | edit
    transpose: 0,
    fontSize: 16,
    showChords: true,
    sidebarTab: "songs",
    lists: [],
    activeListId: null,
    confirmDeleteListId: null,
    listModalSongId: null,
    editingDraft: null,
    confirmDeleteId: null,

  // ---------- offline cache & pending-change queue ----------

  function loadCachedSongs() {
    try {
      var raw = window.localStorage.getItem(CACHE_KEY);
      if (!raw) return null;
      var parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : null;
    } catch (e) { return null; }
  }

  function saveCachedSongs(songs) {
    try { window.localStorage.setItem(CACHE_KEY, JSON.stringify(songs)); } catch (e) {}
  }

  function loadPendingQueue() {
    try {
      var raw = window.localStorage.getItem(PENDING_KEY);
      var parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) { return []; }
  }

  function savePendingQueue(queue) {
    try { window.localStorage.setItem(PENDING_KEY, JSON.stringify(queue)); } catch (e) {}
    state.pendingCount = queue.length;
  }

  function queueChange(change) {
    var queue = loadPendingQueue();
    if (change.type === "delete") {
      queue = queue.filter(function (q) { return !(q.type === "upsert" && q.song.id === change.id); });
    } else {
      queue = queue.filter(function (q) { return !(q.type === "upsert" && q.song.id === change.song.id); });
    }
    queue.push(change);
    savePendingQueue(queue);
    renderSyncStatus();
  }

  function flushPendingQueue() {
    if (!db) return;
    var queue = loadPendingQueue();
    if (queue.length === 0) return;
    var remaining = queue.slice();

    function processNext() {
      if (remaining.length === 0) { savePendingQueue([]); renderSyncStatus(); return; }
      var change = remaining[0];
      var op = change.type === "delete"
        ? db.from("songs").delete().eq("id", change.id)
        : db.from("songs").upsert(change.song, { onConflict: "id" });
      op.then(function (res) {
        if (res && res.error) throw res.error;
        remaining.shift();
        savePendingQueue(remaining);
        renderSyncStatus();
        processNext();
      }).catch(function () {
        // still offline or the server rejected it — stop here and
        // leave the rest queued for the next successful connection.
        savePendingQueue(remaining);
        renderSyncStatus();
      });
    }
    processNext();
  }

  function renderSyncStatus() {
    var el2 = document.getElementById("syncStatus");
    if (!el2) return;
    var queue = loadPendingQueue();
    state.pendingCount = queue.length;
    if (state.offline) {
      el2.textContent = queue.length > 0
        ? "Offline \u2014 " + queue.length + " change" + (queue.length === 1 ? "" : "s") + " will sync"
        : "Offline \u2014 showing last synced copy";
      el2.style.display = "block";
    } else if (queue.length > 0) {
      el2.textContent = "Syncing " + queue.length + " change" + (queue.length === 1 ? "" : "s") + "\u2026";
      el2.style.display = "block";
    } else {
      el2.style.display = "none";
    }
  }

  window.addEventListener("online", function () {
    state.offline = false;
    renderSyncStatus();
    flushPendingQueue();
    fetchAndSetSongs();
  });
  window.addEventListener("offline", function () {
    state.offline = true;
    renderSyncStatus();
  });

  // ---------- shared storage (Supabase) ----------

  function fetchAndSetSongs() {
    if (!db) {
      state.loading = false;
      state.loadError = "no-client";
      renderAll();
      return;
    }
    db.from("songs").select("*").order("title", { ascending: true })
      .then(function (res) {
        if (res.error) throw res.error;
        var rows = res.data || [];
        if (rows.length === 0) {
          // First person to open the book — seed the two starter songs.
          // ignoreDuplicates means this is safe even if two people do it
          // at the same moment, and it never resurrects a song someone
          // deliberately deleted, since that only leaves the table with
          // rows already in it.
          return db.from("songs")
            .upsert(SAMPLE_SONGS, { onConflict: "id", ignoreDuplicates: true })
            .then(function () {
              return db.from("songs").select("*").order("title", { ascending: true });
            })
            .then(function (res2) { return res2.data || []; });
        }
        return rows;
      })
      .then(function (rows) {
        state.songs = rows;
        state.loading = false;
        state.loadError = null;
        state.offline = false;
        saveCachedSongs(rows);
        renderAll();
        flushPendingQueue();
      })
      .catch(function () {
        // No connection (or Supabase unreachable) — fall back to the
        // last synced copy so the book is still readable and editable.
        var cached = loadCachedSongs();
        state.loading = false;
        state.offline = true;
        if (cached) {
          state.songs = mergeWithPending(cached);
          state.loadError = null;
        } else {
          state.loadError = "fetch-failed";
        }
        renderAll();
      });
  }

  function mergeWithPending(songs) {
    var queue = loadPendingQueue();
    if (queue.length === 0) return songs;
    var byId = {};
    songs.forEach(function (s) { byId[s.id] = s; });
    queue.forEach(function (change) {
      if (change.type === "delete") delete byId[change.id];
      else byId[change.song.id] = change.song;
    });
    return Object.keys(byId).map(function (id) { return byId[id]; });
  }

  function upsertSongRemote(song) {
    if (!db || !navigator.onLine) {
      queueChange({ type: "upsert", song: song });
      return;
    }
    db.from("songs").upsert(song, { onConflict: "id" }).then(function (res) {
      if (res && res.error) throw res.error;
    }).catch(function () {
      queueChange({ type: "upsert", song: song });
    });
  }

  function deleteSongRemote(id) {
    if (!db || !navigator.onLine) {
      queueChange({ type: "delete", id: id });
      return;
    }
    db.from("songs").delete().eq("id", id).then(function (res) {
      if (res && res.error) throw res.error;
    }).catch(function () {
      queueChange({ type: "delete", id: id });
    });
  }

  function subscribeRealtime() {
    if (!db) return;
    db.channel("songs-sync")
      .on("postgres_changes", { event: "*", schema: "public", table: "songs" }, function () {
        fetchAndSetSongs();
      })
      .subscribe();
  }

  function loadPrefs() {
    try {
      var theme = window.localStorage.getItem(THEME_KEY);
      if (theme === "dark" || theme === "light") {
        document.documentElement.setAttribute("data-theme", theme);
      }
    } catch (e) {}
    try {
      var fs = parseFloat(window.localStorage.getItem(FONT_KEY));
      if (fs && fs >= 12 && fs <= 28) state.fontSize = fs;
    } catch (e) {}
    try {
      if (window.localStorage.getItem(CHORDS_KEY) === "off") state.showChords = false;
    } catch (e) {}
  }

  function savePrefs() {
    try {
      var theme = document.documentElement.getAttribute("data-theme") || "";
      window.localStorage.setItem(THEME_KEY, theme);
      window.localStorage.setItem(FONT_KEY, String(state.fontSize));
      window.localStorage.setItem(CHORDS_KEY, state.showChords ? "on" : "off");
    } catch (e) {}
  }

  // ---------- chord transposition ----------

  var SHARP_SCALE = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
  var FLAT_TO_SHARP = { "Db":"C#","Eb":"D#","Gb":"F#","Ab":"G#","Bb":"A#","Cb":"B","Fb":"E" };

  function transposeNote(note, semitones) {
    var normalized = FLAT_TO_SHARP[note] || note;
    var idx = SHARP_SCALE.indexOf(normalized);
    if (idx === -1) return note;
    idx = (idx + semitones % 12 + 12) % 12;
    return SHARP_SCALE[idx];
  }

  function transposeChord(chord, semitones) {
    if (!semitones) return chord;
    return chord.replace(/[A-G][#b]?/g, function (m) {
      return transposeNote(m, semitones);
    });
  }

  // ---------- chordpro-ish line parsing ----------

  function buildLine(rawLine, semitones) {
    var regex = /\[([^\]]+)\]/g;
    var lyric = "";
    var entries = [];
    var lastIndex = 0;
    var match;
    while ((match = regex.exec(rawLine)) !== null) {
      lyric += rawLine.slice(lastIndex, match.index);
      entries.push({ pos: lyric.length, chord: transposeChord(match[1], semitones) });
      lastIndex = regex.lastIndex;
    }
    lyric += rawLine.slice(lastIndex);

    var chordLine = "";
    var segments = [];
    entries.forEach(function (entry) {
      var pos = entry.pos;
      if (pos < chordLine.length) pos = chordLine.length;
      var gap = pos - chordLine.length;
      while (chordLine.length < pos) chordLine += " ";
      chordLine += entry.chord + " ";
      segments.push({ gap: gap, chord: entry.chord });
    });

    return { chordLine: chordLine, lyric: lyric, hasChords: entries.length > 0, segments: segments };
  }

  // ---------- chord shapes & tones ----------

  var E_SHAPE = {
    "":     [0, 2, 2, 1, 0, 0],
    "m":    [0, 2, 2, 0, 0, 0],
    "7":    [0, 2, 0, 1, 0, 0],
    "m7":   [0, 2, 0, 0, 0, 0],
    "maj7": [0, 2, 1, 1, 0, 0]
  };
  var A_SHAPE = {
    "":     ["x", 0, 2, 2, 2, 0],
    "m":    ["x", 0, 2, 2, 1, 0],
    "7":    ["x", 0, 2, 0, 2, 0],
    "m7":   ["x", 0, 2, 0, 1, 0],
    "maj7": ["x", 0, 2, 1, 2, 0],
    "sus2": ["x", 0, 2, 2, 0, 0],
    "sus4": ["x", 0, 2, 2, 3, 0]
  };

  // Real first-position fingerings for roots whose open shape isn't a plain
  // E-shape or A-shape barre (C and D families, plus a few common extras).
  var OPEN_CHORDS = {
    "C":      ["x", 3, 2, 0, 1, 0],
    "C7":     ["x", 3, 2, 3, 1, 0],
    "Cmaj7":  ["x", 3, 2, 0, 0, 0],
    "D":      ["x", "x", 0, 2, 3, 2],
    "Dm":     ["x", "x", 0, 2, 3, 1],
    "D7":     ["x", "x", 0, 2, 1, 2],
    "Dmaj7":  ["x", "x", 0, 2, 2, 2],
    "Dsus2":  ["x", "x", 0, 2, 3, 0],
    "Dsus4":  ["x", "x", 0, 2, 3, 3],
    "G":      [3, 2, 0, 0, 0, 3],
    "G7":     [3, 2, 0, 0, 0, 1],
    "Fmaj7":  ["x", "x", 3, 2, 1, 0],
    "B7":     ["x", 2, 1, 2, 0, 2]
  };

  var PIANO_INTERVALS = {
    "":      [0, 4, 7],
    "m":     [0, 3, 7],
    "7":     [0, 4, 7, 10],
    "m7":    [0, 3, 7, 10],
    "maj7":  [0, 4, 7, 11],
    "sus2":  [0, 2, 7],
    "sus4":  [0, 5, 7],
    "dim":   [0, 3, 6],
    "dim7":  [0, 3, 6, 9],
    "m7b5":  [0, 3, 6, 10],
    "aug":   [0, 4, 8],
    "6":     [0, 4, 7, 9],
    "m6":    [0, 3, 7, 9],
    "9":     [0, 2, 4, 7, 10],
    "add9":  [0, 2, 4, 7],
    "m9":    [0, 2, 3, 7, 10]
  };

  var QUALITY_PATTERNS = [
    [/^maj7$/i, "maj7"], [/^M7$/, "maj7"], [/^\u03947$/, "maj7"],
    [/^m7b5$/i, "m7b5"], [/^m7-5$/i, "m7b5"], [/^\u00f8$/, "m7b5"],
    [/^m7$/i, "m7"], [/^min7$/i, "m7"], [/^-7$/, "m7"],
    [/^m9$/i, "m9"], [/^min9$/i, "m9"],
    [/^add9$/i, "add9"],
    [/^9$/, "9"],
    [/^dim7$/i, "dim7"],
    [/^dim$/i, "dim"], [/^\u00b0$/, "dim"],
    [/^aug$/i, "aug"], [/^\+$/, "aug"],
    [/^sus2$/i, "sus2"],
    [/^sus4$/i, "sus4"], [/^sus$/i, "sus4"],
    [/^6$/, "6"],
    [/^m6$/i, "m6"], [/^min6$/i, "m6"],
    [/^7$/, "7"],
    [/^m$/i, "m"], [/^min$/i, "m"], [/^-$/, "m"],
    [/^maj$/i, ""], [/^M$/, ""],
    [/^$/, ""]
  ];

  function parseChordSymbol(sym) {
    var s = (sym || "").trim();
    var bass = null;
    var slashIdx = s.indexOf("/");
    if (slashIdx !== -1) { bass = s.slice(slashIdx + 1).trim(); s = s.slice(0, slashIdx); }
    var m = s.match(/^([A-G])([#b]?)(.*)$/);
    if (!m) return null;
    var root = m[1] + m[2];
    var normalized = FLAT_TO_SHARP[root] || root;
    var rootIdx = SHARP_SCALE.indexOf(normalized);
    if (rootIdx === -1) return null;
    var quality = null;
    var rawQuality = (m[3] || "").trim();
    for (var i = 0; i < QUALITY_PATTERNS.length; i++) {
      if (QUALITY_PATTERNS[i][0].test(rawQuality)) { quality = QUALITY_PATTERNS[i][1]; break; }
    }
    return { root: root, rootIdx: rootIdx, quality: quality, rawQuality: rawQuality, bass: bass };
  }

  function getGuitarShape(rootIdx, quality) {
    var openKey = SHARP_SCALE[rootIdx] + quality;
    if (OPEN_CHORDS[openKey]) {
      return { frets: OPEN_CHORDS[openKey].slice(), barreFret: 0 };
    }
    var eIdx = SHARP_SCALE.indexOf("E");
    var aIdx = SHARP_SCALE.indexOf("A");
    var options = [];
    if (E_SHAPE[quality]) {
      var d1 = (rootIdx - eIdx + 12) % 12;
      options.push({ frets: E_SHAPE[quality].map(function (v) { return v === "x" ? "x" : v + d1; }), barreFret: d1 });
    }
    if (A_SHAPE[quality]) {
      var d2 = (rootIdx - aIdx + 12) % 12;
      options.push({ frets: A_SHAPE[quality].map(function (v) { return v === "x" ? "x" : v + d2; }), barreFret: d2 });
    }
    if (options.length === 0) return null;
    options.sort(function (a, b) {
      var aMax = Math.max.apply(null, a.frets.filter(function (f) { return f !== "x"; }));
      var bMax = Math.max.apply(null, b.frets.filter(function (f) { return f !== "x"; }));
      return aMax - bMax;
    });
    return options[0];
  }

  function getPianoTones(rootIdx, quality) {
    var intervals = PIANO_INTERVALS[quality];
    if (!intervals) return null;
    return intervals.map(function (iv) { return (rootIdx + iv) % 12; });
  }

  // ---------- diagram SVG builders ----------

  var NOTE_LABELS = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];

  function svgEl(name, attrs) {
    var e = document.createElementNS("http://www.w3.org/2000/svg", name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  function buildGuitarSVG(shape) {
    var frets = shape.frets;
    var d = shape.barreFret;
    var left = 26, top = 30, colGap = 18, rowH = 22, rows = 4;
    var width = left + colGap * 5 + 20;
    var height = top + rowH * rows + 14;
    var svg = svgEl("svg", { viewBox: "0 0 " + width + " " + height, width: width, height: height, role: "img", "aria-label": "Guitar chord diagram" });

    if (d > 0) {
      var lbl = svgEl("text", { x: left - 10, y: top + rowH * 0.65, "font-size": 11, "text-anchor": "end", fill: "var(--ink-soft)", "font-family": "var(--font-ui)" });
      lbl.textContent = (d + 1) + "fr";
      svg.appendChild(lbl);
    }

    // nut or top border
    svg.appendChild(svgEl("line", { x1: left, y1: top, x2: left + colGap * 5, y2: top, stroke: "var(--ink)", "stroke-width": d === 0 ? 3 : 1.5 }));
    for (var r = 1; r <= rows; r++) {
      svg.appendChild(svgEl("line", { x1: left, y1: top + r * rowH, x2: left + colGap * 5, y2: top + r * rowH, stroke: "var(--rule)", "stroke-width": 1 }));
    }
    for (var c = 0; c < 6; c++) {
      svg.appendChild(svgEl("line", { x1: left + c * colGap, y1: top, x2: left + c * colGap, y2: top + rows * rowH, stroke: "var(--rule)", "stroke-width": 1 }));
    }

    var barreStrings = [];
    frets.forEach(function (v, i) { if (v !== "x") barreStrings.push(i); });
    if (d > 0 && barreStrings.length > 1) {
      var bx1 = left + barreStrings[0] * colGap;
      var bx2 = left + barreStrings[barreStrings.length - 1] * colGap;
      svg.appendChild(svgEl("line", { x1: bx1, y1: top + rowH * 0.5, x2: bx2, y2: top + rowH * 0.5, stroke: "var(--amber-deep)", "stroke-width": 9, "stroke-linecap": "round", opacity: 0.9 }));
    }

    frets.forEach(function (v, i) {
      var x = left + i * colGap;
      if (v === "x") {
        var xt = svgEl("text", { x: x, y: top - 10, "font-size": 13, "text-anchor": "middle", fill: "var(--ink-faint)", "font-family": "var(--font-ui)" });
        xt.textContent = "\u00d7";
        svg.appendChild(xt);
      } else if (d === 0 && v === 0) {
        svg.appendChild(svgEl("circle", { cx: x, cy: top - 11, r: 4.5, fill: "none", stroke: "var(--ink-soft)", "stroke-width": 1.5 }));
      } else {
        var cy = top + (v - d + 0.5) * rowH;
        svg.appendChild(svgEl("circle", { cx: x, cy: cy, r: 6, fill: "var(--amber-deep)" }));
      }
    });

    return svg;
  }

  function buildPianoSVG(rootIdx, tones) {
    var whiteOrder = [0, 2, 4, 5, 7, 9, 11];
    var blackOrder = [1, 3, null, 6, 8, 10, null];
    var wW = 30, wH = 100, bW = 18, bH = 62;
    var width = wW * 7, height = wH + 6;
    var svg = svgEl("svg", { viewBox: "0 0 " + width + " " + height, width: width, height: height, role: "img", "aria-label": "Piano chord diagram" });

    whiteOrder.forEach(function (pc, i) {
      var isTone = tones.indexOf(pc) !== -1;
      var isRoot = pc === rootIdx;
      svg.appendChild(svgEl("rect", {
        x: i * wW, y: 0, width: wW - 1, height: wH,
        fill: isRoot ? "var(--amber-deep)" : (isTone ? "var(--amber-wash)" : "var(--paper-raised)"),
        stroke: "var(--rule)", "stroke-width": 1, rx: 2
      }));
    });
    blackOrder.forEach(function (pc, i) {
      if (pc === null) return;
      var isTone = tones.indexOf(pc) !== -1;
      var isRoot = pc === rootIdx;
      var x = (i + 1) * wW - bW / 2;
      svg.appendChild(svgEl("rect", {
        x: x, y: 0, width: bW, height: bH,
        fill: isRoot ? "var(--amber-deep)" : (isTone ? "var(--amber)" : "var(--ink)"),
        stroke: "var(--paper-raised)", "stroke-width": 1, rx: 2
      }));
    });

    return svg;
  }

  // ---------- chord modal ----------

  var chordModalScrim = document.getElementById("chordModalScrim");
  var chordModalTitle = document.getElementById("chordModalTitle");
  var chordModalBody = document.getElementById("chordModalBody");
  var chordModalClose = document.getElementById("chordModalClose");

  function openChordModal(chordLabel) {
    chordModalTitle.textContent = chordLabel;
    chordModalBody.innerHTML = "";

    var parsed = parseChordSymbol(chordLabel);
    if (!parsed || parsed.quality === null) {
      var note = el("div", "diagram-note", "This chord's written as \u201c" + chordLabel + "\u201d \u2014 not a shape I recognize yet, so there's no diagram to show.");
      chordModalBody.appendChild(note);
      chordModalScrim.classList.add("open");
      return;
    }

    var guitarShape = getGuitarShape(parsed.rootIdx, parsed.quality);
    var guitarBlock = el("div", "diagram-block");
    if (guitarShape) {
      guitarBlock.appendChild(buildGuitarSVG(guitarShape));
      guitarBlock.appendChild(el("div", "diagram-caption", "GUITAR"));
    } else {
      guitarBlock.appendChild(el("div", "diagram-note", "No guitar voicing on file for this one \u2014 try the piano shape below to hear it."));
    }
    chordModalBody.appendChild(guitarBlock);

    var tones = getPianoTones(parsed.rootIdx, parsed.quality);
    if (tones) {
      var pianoBlock = el("div", "diagram-block");
      pianoBlock.appendChild(buildPianoSVG(parsed.rootIdx, tones));
      pianoBlock.appendChild(el("div", "diagram-caption", "PIANO"));
      var uniqueTones = tones.filter(function (t, i) { return tones.indexOf(t) === i; });
      pianoBlock.appendChild(el("div", "tone-list", uniqueTones.map(function (t) { return NOTE_LABELS[t]; }).join(", ")));
      chordModalBody.appendChild(pianoBlock);
    }

    chordModalScrim.classList.add("open");
  }

  function closeChordModal() {
    chordModalScrim.classList.remove("open");
  }

  chordModalClose.addEventListener("click", closeChordModal);
  chordModalScrim.addEventListener("click", function (e) {
    if (e.target === chordModalScrim) closeChordModal();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && chordModalScrim.classList.contains("open")) closeChordModal();
  });

  // ---------- rendering ----------

  var stageEl = document.getElementById("stage");
  var songListEl = document.getElementById("songList");

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }

  function renderSongsTab() {
    var query = (document.getElementById("searchInput").value || "").toLowerCase().trim();
    songListEl.innerHTML = "";
    var filtered = state.songs.filter(function (s) {
      if (!query) return true;
      return (s.title || "").toLowerCase().indexOf(query) !== -1 ||
             (s.artist || "").toLowerCase().indexOf(query) !== -1;
    });

    if (filtered.length === 0) {
      var empty = el("div", "empty-list",
        state.songs.length === 0
          ? "No hymns yet. Add your first one to start the book."
          : "Nothing matches that search.");
      songListEl.appendChild(empty);
      return;
    }

    filtered.forEach(function (song) {
      var btn = el("button", "song-card" + (song.id === state.activeId ? " active" : ""));
      btn.appendChild(el("div", "t", song.title || "Untitled"));
      if (song.artist) btn.appendChild(el("div", "a", song.artist));
      btn.addEventListener("click", function () {
        selectSong(song.id);
        closeDrawer();
      });
      songListEl.appendChild(btn);
    });
  }

  function selectSong(id) {
    state.activeId = id;
    state.mode = "view";
    state.transpose = 0;
    state.confirmDeleteId = null;
    renderAll();
  }

  function getActiveSong() {
    return state.songs.find(function (s) { return s.id === state.activeId; }) || null;
  }

  function renderStage() {
    stageEl.innerHTML = "";
    document.documentElement.style.setProperty("--lyric-size", state.fontSize + "px");

    if (state.mode === "edit") {
      renderEditor();
      return;
    }

    var song = getActiveSong();
    if (!song) {
      renderPlaceholder();
      return;
    }

    // Header
    var head = el("div", "song-head");
    head.appendChild(el("h1", "song-title", song.title || "Untitled"));
    if (song.artist) head.appendChild(el("div", "song-artist", song.artist));
    stageEl.appendChild(head);

    if (song.key || song.capo) {
      var tagRow = el("div", "tag-row");
      if (song.key) {
        var t1 = el("span", "tag");
        t1.appendChild(document.createTextNode("Key "));
        t1.appendChild(el("b", null, effectiveKeyLabel(song.key)));
        tagRow.appendChild(t1);
      }
      if (song.capo) {
        var t2 = el("span", "tag");
        t2.appendChild(document.createTextNode("Capo "));
        t2.appendChild(el("b", null, song.capo));
        tagRow.appendChild(t2);
      }
      stageEl.appendChild(tagRow);
    }

    // Prev / next when browsing a list
    var navList = state.activeListId ? getList(state.activeListId) : null;
    if (navList) {
      var navIds = listSongIds(navList);
      var navPos = navIds.indexOf(song.id);
      if (navPos !== -1) {
        var nav = el("div", "list-nav");
        nav.appendChild(el("span", null, (navList.name || "List") + " \u2014 " + (navPos + 1) + " of " + navIds.length));
        var prevBtn = el("button", "step-btn", "\u2039 Prev");
        prevBtn.disabled = navPos === 0;
        prevBtn.addEventListener("click", function () { selectSong(navIds[navPos - 1]); });
        var nextBtn = el("button", "step-btn", "Next \u203a");
        nextBtn.disabled = navPos === navIds.length - 1;
        nextBtn.addEventListener("click", function () { selectSong(navIds[navPos + 1]); });
        nav.appendChild(prevBtn);
        nav.appendChild(nextBtn);
        stageEl.appendChild(nav);
      }
    }

    // Toolbar
    var toolbar = el("div", "toolbar");

    var viewGroup = el("div", "tool-group");
    viewGroup.appendChild(el("span", "tool-label", "View"));
    var seg = el("div", "seg");
    var withChordsBtn = el("button", state.showChords ? "active" : "", "Chords");
    withChordsBtn.setAttribute("aria-pressed", state.showChords ? "true" : "false");
    withChordsBtn.addEventListener("click", function () {
      state.showChords = true;
      savePrefs();
      renderStage();
    });
    var lyricsOnlyBtn = el("button", state.showChords ? "" : "active", "Lyrics only");
    lyricsOnlyBtn.setAttribute("aria-pressed", state.showChords ? "false" : "true");
    lyricsOnlyBtn.addEventListener("click", function () {
      state.showChords = false;
      savePrefs();
      renderStage();
    });
    seg.appendChild(withChordsBtn);
    seg.appendChild(lyricsOnlyBtn);
    viewGroup.appendChild(seg);
    toolbar.appendChild(viewGroup);

    var transposeGroup = el("div", "tool-group");
    transposeGroup.appendChild(el("span", "tool-label", "Transpose"));
    var minusBtn = el("button", "step-btn", "\u2212");
    minusBtn.setAttribute("aria-label", "Transpose down a semitone");
    minusBtn.addEventListener("click", function () { state.transpose--; renderStage(); });
    var readout = el("span", "step-readout", (state.transpose > 0 ? "+" : "") + state.transpose);
    var plusBtn = el("button", "step-btn", "+");
    plusBtn.setAttribute("aria-label", "Transpose up a semitone");
    plusBtn.addEventListener("click", function () { state.transpose++; renderStage(); });
    transposeGroup.appendChild(minusBtn);
    transposeGroup.appendChild(readout);
    transposeGroup.appendChild(plusBtn);
    if (state.showChords) toolbar.appendChild(transposeGroup);

    var fontGroup = el("div", "tool-group");
    fontGroup.appendChild(el("span", "tool-label", "Text size"));
    var smallerBtn = el("button", "step-btn", "A\u2212");
    smallerBtn.setAttribute("aria-label", "Decrease text size");
    smallerBtn.addEventListener("click", function () {
      state.fontSize = Math.max(12, state.fontSize - 1);
      savePrefs();
      renderStage();
    });
    var biggerBtn = el("button", "step-btn", "A+");
    biggerBtn.setAttribute("aria-label", "Increase text size");
    biggerBtn.addEventListener("click", function () {
      state.fontSize = Math.min(28, state.fontSize + 1);
      savePrefs();
      renderStage();
    });
    fontGroup.appendChild(smallerBtn);
    fontGroup.appendChild(biggerBtn);
    toolbar.appendChild(fontGroup);

    toolbar.appendChild(el("div", "toolbar-spacer"));

    var presentBtn = el("button", "text-btn", "Present");
    presentBtn.setAttribute("aria-label", "Start slide show");
    presentBtn.addEventListener("click", function () {
      var inList = navList && navList.songIds.indexOf(song.id) !== -1;
      startSlideshow(inList ? listSongIds(navList) : [song.id], song.id);
    });
    toolbar.appendChild(presentBtn);

    var addToListBtn = el("button", "text-btn", "Add to list");
    addToListBtn.addEventListener("click", function () { openListModal(song.id); });
    toolbar.appendChild(addToListBtn);

    var editBtn = el("button", "text-btn", "Edit");
    editBtn.addEventListener("click", function () {
      state.mode = "edit";
      state.editingDraft = shallowCopy(song);
      renderStage();
    });
    toolbar.appendChild(editBtn);

    if (state.confirmDeleteId === song.id) {
      var confirmRow = el("span", "confirm-row");
      confirmRow.appendChild(document.createTextNode("Delete this hymn?"));
      var yesBtn = el("button", "text-btn danger", "Yes, delete");
      yesBtn.addEventListener("click", function () { deleteSong(song.id); });
      var noBtn = el("button", "text-btn", "Cancel");
      noBtn.addEventListener("click", function () { state.confirmDeleteId = null; renderStage(); });
      confirmRow.appendChild(yesBtn);
      confirmRow.appendChild(noBtn);
      toolbar.appendChild(confirmRow);
    } else {
      var deleteBtn = el("button", "text-btn danger", "Delete");
      deleteBtn.addEventListener("click", function () {
        state.confirmDeleteId = song.id;
        renderStage();
      });
      toolbar.appendChild(deleteBtn);
    }

    stageEl.appendChild(toolbar);

    // Chart
    var chart = el("div", "chart" + (state.showChords ? "" : " lyrics-only"));
    var lines = (song.body || "").split("\n");
    lines.forEach(function (raw) {
      var trimmed = raw.trim();
      if (trimmed.charAt(0) === "#") {
        chart.appendChild(el("div", "section-label", trimmed.replace(/^#+\s*/, "")));
        return;
      }
      if (trimmed === "") {
        chart.appendChild(el("div", "blank-line"));
        return;
      }
      var built = buildLine(raw, state.transpose);
      if (!state.showChords && built.lyric.trim() === "") return; // chord-only line (intro, solo)
      var lineWrap = el("div", "line");
      if (state.showChords && built.hasChords) {
        var chordRow = el("div", "chord-row");
        built.segments.forEach(function (seg) {
          if (seg.gap > 0) chordRow.appendChild(document.createTextNode(" ".repeat(seg.gap)));
          var tag = document.createElement("button");
          tag.type = "button";
          tag.className = "chord-tag";
          tag.textContent = seg.chord;
          tag.setAttribute("aria-label", "Show diagram for " + seg.chord);
          tag.addEventListener("click", function () { openChordModal(seg.chord); });
          chordRow.appendChild(tag);
          chordRow.appendChild(document.createTextNode(" "));
        });
        lineWrap.appendChild(chordRow);
      }
      lineWrap.appendChild(el("div", "lyric-row", built.lyric));
      chart.appendChild(lineWrap);
    });
    stageEl.appendChild(chart);
  }

  function effectiveKeyLabel(key) {
    if (!state.transpose) return key;
    // key may be like "G" or "Dm"
    var m = key.match(/^([A-G][#b]?)(.*)$/);
    if (!m) return key;
    return transposeNote(m[1], state.transpose) + m[2] + " (from " + key + ")";
  }

  function renderPlaceholder() {
    var wrap = el("div", "placeholder");

    if (state.loading) {
      wrap.appendChild(el("div", "glyph", "\u266A"));
      wrap.appendChild(el("div", null, "Loading the hymns\u2026"));
      wrap.appendChild(el("p", null, "Fetching the shared list \u2014 this only takes a moment."));
      stageEl.appendChild(wrap);
      return;
    }

    if (state.loadError) {
      wrap.appendChild(el("div", "glyph", "\u266A"));
      wrap.appendChild(el("div", null, "Couldn't reach the shared hymn list"));
      wrap.appendChild(el("p", null,
        state.loadError === "no-client"
          ? "The shared backend isn't set up on this copy of the app."
          : "Check your connection and try again."));
      if (state.loadError === "fetch-failed") {
        var retryBtn = el("button", null, "Try again");
        retryBtn.addEventListener("click", function () {
          state.loading = true;
          renderAll();
          fetchAndSetSongs();
        });
        wrap.appendChild(retryBtn);
      }
      stageEl.appendChild(wrap);
      return;
    }

    wrap.appendChild(el("div", "glyph", "\u266A"));
    wrap.appendChild(el("div", null, state.songs.length ? "Pick a hymn from the list" : "No hymns yet"));
    wrap.appendChild(el("p", null,
      state.songs.length
        ? "Choose a title on the left to see its chords, or add a new one."
        : "Add your first hymn with lyrics and chords — you can transpose and resize it any time."));
    var addBtn = el("button", null, "+ New hymn");
    addBtn.addEventListener("click", startNewSong);
    wrap.appendChild(addBtn);
    stageEl.appendChild(wrap);
  }

  function shallowCopy(song) {
    return {
      id: song.id, title: song.title, artist: song.artist,
      key: song.key, capo: song.capo, body: song.body
    };
  }

  function renderEditor() {
    var draft = state.editingDraft;
    var isNew = !state.songs.some(function (s) { return s.id === draft.id; });

    var fields = el("div", "editor-fields");

    var titleField = el("div", "field full");
    titleField.appendChild(el("label", null, "Title"));
    var titleInput = document.createElement("input");
    titleInput.type = "text";
    titleInput.value = draft.title || "";
    titleInput.placeholder = "Hymn title";
    titleInput.addEventListener("input", function () { draft.title = titleInput.value; });
    titleField.appendChild(titleInput);
    fields.appendChild(titleField);

    var artistField = el("div", "field full");
    artistField.appendChild(el("label", null, "Author or composer"));
    var artistInput = document.createElement("input");
    artistInput.type = "text";
    artistInput.value = draft.artist || "";
    artistInput.placeholder = "Author or composer";
    artistInput.addEventListener("input", function () { draft.artist = artistInput.value; });
    artistField.appendChild(artistInput);
    fields.appendChild(artistField);

    var keyField = el("div", "field");
    keyField.appendChild(el("label", null, "Key"));
    var keyInput = document.createElement("input");
    keyInput.type = "text";
    keyInput.value = draft.key || "";
    keyInput.placeholder = "e.g. G, Dm";
    keyInput.addEventListener("input", function () { draft.key = keyInput.value; });
    keyField.appendChild(keyInput);
    fields.appendChild(keyField);

    var capoField = el("div", "field");
    capoField.appendChild(el("label", null, "Capo"));
    var capoInput = document.createElement("input");
    capoInput.type = "text";
    capoInput.value = draft.capo || "";
    capoInput.placeholder = "e.g. 2nd fret";
    capoInput.addEventListener("input", function () { draft.capo = capoInput.value; });
    capoField.appendChild(capoInput);
    fields.appendChild(capoField);

    stageEl.appendChild(fields);

    var help = el("div", "editor-help");
    help.appendChild(document.createTextNode("Put chords in brackets right before the syllable they fall on, like "));
    help.appendChild(el("code", null, "[G]Amazing grace"));
    help.appendChild(document.createTextNode(". Start a line with "));
    help.appendChild(el("code", null, "#"));
    help.appendChild(document.createTextNode(" to mark a section, like "));
    help.appendChild(el("code", null, "# Chorus"));
    help.appendChild(document.createTextNode(". Leave a line blank between verses."));
    stageEl.appendChild(help);

    var textarea = document.createElement("textarea");
    textarea.className = "body-textarea";
    textarea.value = draft.body || "";
    textarea.placeholder = "# Verse 1\n[G]Amazing grace, how [C]sweet the [G]sound\u2026";
    textarea.spellcheck = false;
    textarea.addEventListener("input", function () { draft.body = textarea.value; });
    stageEl.appendChild(textarea);

    var actions = el("div", "editor-actions");
    var cancelBtn = el("button", "btn", "Cancel");
    cancelBtn.addEventListener("click", function () {
      state.mode = "view";
      state.editingDraft = null;
      if (isNew) state.activeId = state.activeId; // no-op, nothing was saved
      renderAll();
    });
    var saveBtn = el("button", "btn primary", isNew ? "Add hymn" : "Save changes");
    saveBtn.addEventListener("click", function () {
      var title = (draft.title || "").trim();
      if (!title) {
        titleInput.focus();
        return;
      }
      draft.title = title;
      if (isNew) {
        state.songs.push(draft);
      } else {
        var idx = state.songs.findIndex(function (s) { return s.id === draft.id; });
        if (idx !== -1) state.songs[idx] = draft;
      }
      upsertSongRemote(draft);
      state.activeId = draft.id;
      state.mode = "view";
      state.transpose = 0;
      state.editingDraft = null;
      renderAll();
    });
    actions.appendChild(cancelBtn);
    actions.appendChild(saveBtn);
    stageEl.appendChild(actions);
  }

  function startNewSong() {
    state.mode = "edit";
    state.editingDraft = {
      id: "song-" + Date.now() + "-" + Math.random().toString(36).slice(2, 7),
      title: "", artist: "", key: "", capo: "", body: ""
    };
    renderAll();
  }

  function deleteSong(id) {
    state.songs = state.songs.filter(function (s) { return s.id !== id; });
    deleteSongRemote(id);
    if (state.activeId === id) {
      state.activeId = null;
      state.mode = "view";
    }
    state.confirmDeleteId = null;
    renderAll();
  }

  function renderAll() {
    renderSongList();
    renderStage();
    renderSyncStatus();
  }

  // ---------- song lists (personal, stored on this device) ----------

  function loadLists() {
    try {
      var raw = window.localStorage.getItem(LISTS_KEY);
      var parsed = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(parsed)) return [];
      return parsed.filter(function (l) { return l && l.id && Array.isArray(l.songIds); });
    } catch (e) { return []; }
  }

  function saveLists() {
    try { window.localStorage.setItem(LISTS_KEY, JSON.stringify(state.lists)); } catch (e) {}
  }

  function getList(id) {
    return state.lists.find(function (l) { return l.id === id; }) || null;
  }

  function songExists(id) {
    return state.songs.some(function (s) { return s.id === id; });
  }

  function listSongIds(list) {
    return list.songIds.filter(songExists);
  }

  function createList(name) {
    var list = {
      id: "list-" + Date.now() + "-" + Math.random().toString(36).slice(2, 7),
      name: name,
      songIds: []
    };
    state.lists.push(list);
    saveLists();
    return list;
  }

  function toggleSongInList(listId, songId) {
    var list = getList(listId);
    if (!list) return;
    var i = list.songIds.indexOf(songId);
    if (i === -1) list.songIds.push(songId); else list.songIds.splice(i, 1);
    saveLists();
  }

  function moveSongInList(listId, songId, delta) {
    var list = getList(listId);
    if (!list) return;
    var ids = listSongIds(list);
    var i = ids.indexOf(songId);
    var j = i + delta;
    if (i === -1 || j < 0 || j >= ids.length) return;
    var tmp = ids[i]; ids[i] = ids[j]; ids[j] = tmp;
    list.songIds = ids;
    saveLists();
  }

  function deleteList(listId) {
    state.lists = state.lists.filter(function (l) { return l.id !== listId; });
    if (state.activeListId === listId) state.activeListId = null;
    state.confirmDeleteListId = null;
    saveLists();
  }

  function syncSidebarChrome() {
    var inLists = state.sidebarTab === "lists";
    document.getElementById("tabSongs").className = inLists ? "" : "active";
    document.getElementById("tabLists").className = inLists ? "active" : "";
    document.getElementById("searchRow").style.display = inLists ? "none" : "";
    document.getElementById("newSongBtn").style.display = inLists ? "none" : "";
    document.getElementById("newListBtn").style.display = (inLists && !state.activeListId) ? "" : "none";
  }

  function renderSongList() {
    syncSidebarChrome();
    if (state.sidebarTab === "lists") renderListsTab(); else renderSongsTab();
  }

  function renderListsTab() {
    songListEl.innerHTML = "";

    if (!state.activeListId) {
      if (state.lists.length === 0) {
        songListEl.appendChild(el("div", "empty-list",
          "No lists yet. Make one for a gig, a service, or a practice session, then add hymns to it from any hymn."));
        return;
      }
      state.lists.forEach(function (list) {
        var btn = el("button", "song-card");
        btn.appendChild(el("div", "t", list.name || "Untitled list"));
        var n = listSongIds(list).length;
        btn.appendChild(el("div", "a", n + (n === 1 ? " hymn" : " hymns")));
        btn.addEventListener("click", function () {
          state.activeListId = list.id;
          state.confirmDeleteListId = null;
          renderSongList();
        });
        songListEl.appendChild(btn);
      });
      return;
    }

    var list = getList(state.activeListId);
    if (!list) { state.activeListId = null; renderSongList(); return; }

    var head = el("div", "list-head");
    var back = el("button", "text-btn", "\u2039 All lists");
    back.style.alignSelf = "flex-start";
    back.addEventListener("click", function () {
      state.activeListId = null;
      state.confirmDeleteListId = null;
      renderSongList();
      renderStage();
    });
    head.appendChild(back);
    var nameInput = document.createElement("input");
    nameInput.type = "text";
    nameInput.className = "list-name-input";
    nameInput.value = list.name || "";
    nameInput.setAttribute("aria-label", "List name");
    nameInput.addEventListener("change", function () {
      var v = nameInput.value.trim();
      list.name = v || "Untitled list";
      saveLists();
    });
    head.appendChild(nameInput);
    var presentIds = listSongIds(list);
    if (presentIds.length > 0) {
      var presentList = el("button", "btn primary", "Present list");
      presentList.addEventListener("click", function () {
        startSlideshow(presentIds, presentIds[0]);
        closeDrawer();
      });
      head.appendChild(presentList);
    }
    songListEl.appendChild(head);

    var ids = listSongIds(list);
    if (ids.length === 0) {
      songListEl.appendChild(el("div", "empty-list",
        "This list is empty. Open a hymn from the Hymns tab and tap \u201cAdd to list\u201d."));
    }
    ids.forEach(function (id, idx) {
      var song = state.songs.find(function (s) { return s.id === id; });
      var row = el("div", "list-row");
      var btn = el("button", "song-card" + (id === state.activeId ? " active" : ""));
      btn.appendChild(el("div", "t", (idx + 1) + ". " + (song.title || "Untitled")));
      if (song.artist) btn.appendChild(el("div", "a", song.artist));
      btn.addEventListener("click", function () { selectSong(id); closeDrawer(); });
      row.appendChild(btn);

      var tools = el("div", "row-tools");
      var up = el("button", null, "\u2191");
      up.setAttribute("aria-label", "Move up");
      up.disabled = idx === 0;
      up.addEventListener("click", function () { moveSongInList(list.id, id, -1); renderSongList(); renderStage(); });
      var down = el("button", null, "\u2193");
      down.setAttribute("aria-label", "Move down");
      down.disabled = idx === ids.length - 1;
      down.addEventListener("click", function () { moveSongInList(list.id, id, 1); renderSongList(); renderStage(); });
      var rm = el("button", null, "\u00d7");
      rm.setAttribute("aria-label", "Remove from list");
      rm.addEventListener("click", function () { toggleSongInList(list.id, id); renderSongList(); renderStage(); });
      tools.appendChild(up); tools.appendChild(down); tools.appendChild(rm);
      row.appendChild(tools);
      songListEl.appendChild(row);
    });

    var foot = el("div", "list-foot");
    if (state.confirmDeleteListId === list.id) {
      var cr = el("span", "confirm-row");
      cr.appendChild(document.createTextNode("Delete this list?"));
      var yes = el("button", "text-btn danger", "Yes, delete");
      yes.addEventListener("click", function () { deleteList(list.id); renderSongList(); renderStage(); });
      var no = el("button", "text-btn", "Cancel");
      no.addEventListener("click", function () { state.confirmDeleteListId = null; renderSongList(); });
      cr.appendChild(yes); cr.appendChild(no);
      foot.appendChild(cr);
    } else {
      var del = el("button", "text-btn danger", "Delete list");
      del.addEventListener("click", function () { state.confirmDeleteListId = list.id; renderSongList(); });
      foot.appendChild(del);
    }
    songListEl.appendChild(foot);
  }

  // "Add to list" panel opened from a song

  var listModalScrim = document.getElementById("listModalScrim");
  var listModalBody = document.getElementById("listModalBody");

  function openListModal(songId) {
    state.listModalSongId = songId;
    renderListModal();
    listModalScrim.classList.add("open");
  }

  function closeListModal() {
    listModalScrim.classList.remove("open");
    state.listModalSongId = null;
    renderAll();
  }

  function renderListModal() {
    var songId = state.listModalSongId;
    listModalBody.innerHTML = "";

    if (state.lists.length === 0) {
      listModalBody.appendChild(el("div", "diagram-note",
        "You don't have any lists yet. Name your first one below and this hymn goes straight in."));
    }
    state.lists.forEach(function (list) {
      var row = el("label", "check-row");
      var box = document.createElement("input");
      box.type = "checkbox";
      box.checked = list.songIds.indexOf(songId) !== -1;
      box.addEventListener("change", function () {
        toggleSongInList(list.id, songId);
        renderSongList();
      });
      row.appendChild(box);
      row.appendChild(el("span", null, list.name || "Untitled list"));
      listModalBody.appendChild(row);
    });

    var newRow = el("div", "new-list-row");
    var input = document.createElement("input");
    input.type = "text";
    input.placeholder = "New list name";
    input.setAttribute("aria-label", "New list name");
    var add = el("button", "btn primary", "Create");
    function submit() {
      var name = input.value.trim();
      if (!name) { input.focus(); return; }
      var list = createList(name);
      toggleSongInList(list.id, songId);
      renderListModal();
      renderSongList();
    }
    add.addEventListener("click", submit);
    input.addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); });
    newRow.appendChild(input);
    newRow.appendChild(add);
    listModalBody.appendChild(newRow);
  }

  document.getElementById("listModalClose").addEventListener("click", closeListModal);
  listModalScrim.addEventListener("click", function (e) {
    if (e.target === listModalScrim) closeListModal();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && listModalScrim.classList.contains("open")) closeListModal();
  });

  // sidebar tabs + new list

  document.getElementById("tabSongs").addEventListener("click", function () {
    state.sidebarTab = "songs";
    renderSongList();
  });
  document.getElementById("tabLists").addEventListener("click", function () {
    state.sidebarTab = "lists";
    renderSongList();
  });
  document.getElementById("newListBtn").addEventListener("click", function () {
    var list = createList("List " + (state.lists.length + 1));
    state.activeListId = list.id;
    renderSongList();
    var input = songListEl.querySelector(".list-name-input");
    if (input) { input.focus(); input.select(); }
  });

  // ---------- slide show (one verse per slide) ----------

  var slideshowEl = document.getElementById("slideshow");
  var slStage = document.getElementById("slStage");
  var slidesOpen = false;
  var deck = [];
  var cur = 0;
  var slideChords = false;
  var idleTimer = null;
  var wakeLock = null;
  var touchX = null, touchY = null, lastSwipe = 0;

  // A song becomes: a title slide, then one slide per section. A section
  // starts at a "# Label" line and ends at the next label or a blank line.
  function buildSlidesForSong(song, transposeBy) {
    var title = song.title || "Untitled";
    var slides = [{ kind: "title", songId: song.id, title: title, artist: song.artist || "", hasLyrics: true }];
    var label = "";
    var block = [];
    function flush() {
      if (block.length) {
        slides.push({
          kind: "verse", songId: song.id, title: title, label: label, lines: block, transpose: transposeBy,
          hasLyrics: block.some(function (l) { return buildLine(l, 0).lyric.trim() !== ""; })
        });
      }
      block = [];
      label = "";
    }
    (song.body || "").split("\n").forEach(function (raw) {
      var t = raw.trim();
      if (t.charAt(0) === "#") { flush(); label = t.replace(/^#+\s*/, ""); return; }
      if (t === "") { if (block.length) flush(); return; }
      block.push(raw);
    });
    flush();
    return slides;
  }

  function visibleIndices() {
    var out = [];
    deck.forEach(function (s, i) { if (slideChords || s.hasLyrics) out.push(i); });
    return out;
  }

  function startSlideshow(songIds, startSongId) {
    var built = [];
    var startIndex = 0;
    songIds.forEach(function (id) {
      var song = state.songs.find(function (s) { return s.id === id; });
      if (!song) return;
      if (id === startSongId) startIndex = built.length;
      built = built.concat(buildSlidesForSong(song, id === state.activeId ? state.transpose : 0));
    });
    if (built.length === 0) return;
    deck = built;
    cur = startIndex;
    slidesOpen = true;
    slideshowEl.classList.remove("blank");
    slideshowEl.classList.add("open");
    try { history.pushState({ songbookSlides: true }, ""); } catch (e) {}
    try {
      if (slideshowEl.requestFullscreen) {
        var p = slideshowEl.requestFullscreen();
        if (p && p.catch) p.catch(function () {});
      }
    } catch (e) {}
    requestWake();
    slideshowEl.focus();
    renderSlide();
    wakeControls();
  }

  function renderSlide() {
    var vis = visibleIndices();
    if (vis.indexOf(cur) === -1) {
      var later = vis.filter(function (i) { return i > cur; });
      cur = later.length ? later[0] : vis[vis.length - 1];
    }
    var s = deck[cur];
    slStage.innerHTML = "";
    var wrap = el("div", "sl-content");
    var main;
    if (s.kind === "title") {
      main = el("div", "sl-title", s.title);
      wrap.appendChild(main);
      if (s.artist) wrap.appendChild(el("div", "sl-artist", s.artist));
    } else {
      if (s.label) wrap.appendChild(el("div", "sl-label", s.label));
      if (slideChords) {
        main = el("div", "sl-chords");
        s.lines.forEach(function (raw) {
          var b = buildLine(raw, s.transpose);
          if (b.hasChords) main.appendChild(el("div", "c", b.chordLine));
          if (b.lyric.trim() !== "") main.appendChild(el("div", null, b.lyric));
        });
      } else {
        var texts = [];
        s.lines.forEach(function (raw) {
          var b = buildLine(raw, 0);
          if (b.lyric.trim() !== "") texts.push(b.lyric.trim());
        });
        main = el("div", "sl-body", texts.join("\n"));
      }
      wrap.appendChild(main);
    }
    slStage.appendChild(wrap);

    var pos = vis.indexOf(cur);
    document.getElementById("slSong").textContent = s.title;
    document.getElementById("slCount").textContent = (pos + 1) + " / " + vis.length;
    document.getElementById("slBar").style.width = (vis.length ? ((pos + 1) / vis.length) * 100 : 0) + "%";
    document.getElementById("slPrev").disabled = pos <= 0;
    document.getElementById("slNext").disabled = pos >= vis.length - 1;
    var cb = document.getElementById("slChords");
    cb.className = "sl-btn" + (slideChords ? " active" : "");
    cb.setAttribute("aria-pressed", slideChords ? "true" : "false");
    fitSlide(wrap, main, s);
  }

  // Shrink the text until the whole slide fits the screen.
  function fitSlide(wrap, main, s) {
    var isChords = main.classList.contains("sl-chords");
    var size;
    if (s.kind === "title") size = Math.min(120, Math.floor(window.innerHeight * 0.14));
    else if (isChords) size = Math.min(54, Math.floor(window.innerHeight * 0.06));
    else size = Math.min(104, Math.floor(window.innerHeight * 0.11));
    main.style.fontSize = size + "px";
    var cs = window.getComputedStyle(slStage);
    var availH = slStage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    var availW = slStage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    if (!(availH > 0) || !(availW > 0)) return;
    var guard = 0;
    while (guard++ < 90 && size > 12 && (wrap.offsetHeight > availH || main.scrollWidth > availW + 1)) {
      size -= 2;
      main.style.fontSize = size + "px";
    }
  }

  function goSlide(delta) {
    var vis = visibleIndices();
    var target = vis[vis.indexOf(cur) + delta];
    if (target === undefined) { wakeControls(); return; }
    cur = target;
    renderSlide();
  }

  function goEdge(last) {
    var vis = visibleIndices();
    cur = last ? vis[vis.length - 1] : vis[0];
    renderSlide();
  }

  function wakeControls() {
    slideshowEl.classList.remove("idle");
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () { slideshowEl.classList.add("idle"); }, 2800);
  }

  function toggleSlideChords() {
    slideChords = !slideChords;
    renderSlide();
  }

  function toggleFullscreen() {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else if (slideshowEl.requestFullscreen) slideshowEl.requestFullscreen();
    } catch (e) {}
  }

  function requestWake() {
    try {
      if (navigator.wakeLock && navigator.wakeLock.request) {
        navigator.wakeLock.request("screen").then(function (l) { wakeLock = l; }).catch(function () {});
      }
    } catch (e) {}
  }

  function releaseWake() {
    try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch (e) {}
  }

  function finishSlideshow() {
    if (!slidesOpen) return;
    slidesOpen = false;
    var last = deck[cur];
    var endSongId = last ? last.songId : null;
    slideshowEl.classList.remove("open", "blank", "idle");
    slStage.innerHTML = "";
    clearTimeout(idleTimer);
    releaseWake();
    try { if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen(); } catch (e) {}
    deck = [];
    if (endSongId && endSongId !== state.activeId && songExists(endSongId)) selectSong(endSongId);
  }

  function closeSlideshow() {
    if (!slidesOpen) return;
    var usedHistory = false;
    try {
      if (history.state && history.state.songbookSlides) { usedHistory = true; history.back(); }
    } catch (e) {}
    if (!usedHistory) finishSlideshow();
  }

  window.addEventListener("popstate", function () { if (slidesOpen) finishSlideshow(); });

  function bindSlideButton(id, fn) {
    document.getElementById(id).addEventListener("click", function (e) {
      e.stopPropagation();
      fn();
      e.currentTarget.blur();
      wakeControls();
    });
  }
  bindSlideButton("slChords", toggleSlideChords);
  bindSlideButton("slFull", toggleFullscreen);
  bindSlideButton("slClose", closeSlideshow);
  bindSlideButton("slPrev", function () { goSlide(-1); });
  bindSlideButton("slNext", function () { goSlide(1); });

  slideshowEl.addEventListener("click", function (e) {
    if (e.target.closest && e.target.closest(".sl-top, .sl-bottom")) return;
    if (Date.now() - lastSwipe < 400) return;
    if (slideshowEl.classList.contains("blank")) { slideshowEl.classList.remove("blank"); return; }
    var w = slideshowEl.clientWidth || window.innerWidth;
    if (e.clientX < w * 0.33) goSlide(-1); else goSlide(1);
    wakeControls();
  });
  slideshowEl.addEventListener("mousemove", wakeControls);
  slideshowEl.addEventListener("touchstart", function (e) {
    var t = e.touches && e.touches[0];
    if (t) { touchX = t.clientX; touchY = t.clientY; }
    wakeControls();
  }, { passive: true });
  slideshowEl.addEventListener("touchend", function (e) {
    var t = e.changedTouches && e.changedTouches[0];
    if (!t || touchX === null) return;
    var dx = t.clientX - touchX, dy = t.clientY - touchY;
    touchX = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      lastSwipe = Date.now();
      goSlide(dx < 0 ? 1 : -1);
    }
  }, { passive: true });

  document.addEventListener("keydown", function (e) {
    if (!slidesOpen) return;
    var k = e.key;
    var onButton = e.target && e.target.tagName === "BUTTON";
    if (k === "ArrowRight" || k === "PageDown" || k === "ArrowDown" || ((k === " " || k === "Enter") && !onButton)) { e.preventDefault(); goSlide(1); }
    else if (k === "ArrowLeft" || k === "PageUp" || k === "ArrowUp" || k === "Backspace") { e.preventDefault(); goSlide(-1); }
    else if (k === "Home") { e.preventDefault(); goEdge(false); }
    else if (k === "End") { e.preventDefault(); goEdge(true); }
    else if (k === "Escape") { closeSlideshow(); }
    else if (k === "f" || k === "F") { toggleFullscreen(); }
    else if (k === "c" || k === "C") { toggleSlideChords(); }
    else if (k === "b" || k === "B" || k === ".") { slideshowEl.classList.toggle("blank"); }
    else return;
    wakeControls();
  });

  window.addEventListener("resize", function () { if (slidesOpen && deck.length) renderSlide(); });
  document.addEventListener("fullscreenchange", function () {
    document.getElementById("slFull").textContent = document.fullscreenElement ? "Exit fullscreen" : "Fullscreen";
    if (slidesOpen && deck.length) renderSlide();
  });
  document.addEventListener("visibilitychange", function () {
    if (slidesOpen && document.visibilityState === "visible") requestWake();
  });

  // ---------- drawer (mobile) ----------

  var appEl = document.getElementById("app");
  function openDrawer() { appEl.classList.add("drawer-open"); }
  function closeDrawer() { appEl.classList.remove("drawer-open"); }
  document.getElementById("openDrawer").addEventListener("click", openDrawer);
  document.getElementById("closeDrawer").addEventListener("click", closeDrawer);
  document.getElementById("scrim").addEventListener("click", closeDrawer);

  // ---------- wiring ----------

  document.getElementById("searchInput").addEventListener("input", renderSongList);
  document.getElementById("newSongBtn").addEventListener("click", function () {
    startNewSong();
    closeDrawer();
  });

  var themeToggle = document.getElementById("themeToggle");
  var themeLabel = document.getElementById("themeLabel");
  function currentIsDark() {
    var attr = document.documentElement.getAttribute("data-theme");
    if (attr === "dark") return true;
    if (attr === "light") return false;
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  function updateThemeLabel() {
    themeLabel.textContent = currentIsDark() ? "Stage lights on" : "Stage lights off";
  }
  themeToggle.addEventListener("click", function () {
    var next = currentIsDark() ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    savePrefs();
    updateThemeLabel();
  });

  // ---------- install prompt (Android / Chrome) ----------

  var installRow = document.getElementById("installRow");
  var installBtn = document.getElementById("installBtn");
  var deferredInstallEvent = null;

  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    deferredInstallEvent = e;
    installRow.classList.add("visible");
  });

  installBtn.addEventListener("click", function () {
    if (!deferredInstallEvent) return;
    deferredInstallEvent.prompt();
    deferredInstallEvent.userChoice.finally(function () {
      deferredInstallEvent = null;
      installRow.classList.remove("visible");
    });
  });

  window.addEventListener("appinstalled", function () {
    installRow.classList.remove("visible");
    deferredInstallEvent = null;
  });

  // ---------- init ----------

  loadPrefs();
  state.lists = loadLists();
  updateThemeLabel();
  renderAll();
  fetchAndSetSongs();
  subscribeRealtime();

  // Real caching service worker, so the app shell itself (this page,
  // the font stylesheet, the Supabase library) loads with no network
  // at all once it's been opened successfully one time. This is a real
  // sw.js file sitting next to index.html — much more reliable than a
  // blob-registered worker, since browsers know how to detect and
  // apply updates to an actual file automatically. Registration is
  // wrapped in try/catch and silently no-ops if sw.js isn't present
  // (e.g. when this HTML is opened as a single standalone file) —
  // nothing else in the app depends on it.
  try {
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    }
  } catch (e) {}

})();
</script>
</body>
</html>
